name: BallparkMatchups
options:
  bundleIdPrefix: com.nick
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "5"

targets:
  BallparkMatchups:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BallparkMatchups
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Resources/venues.json
      - path: Resources/situationCodes.json
    info:
      path: BallparkMatchups/Info.plist
      properties:
        CFBundleDisplayName: BallparkMatchups
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        # These must be substitutions, not literals. Without them XcodeGen writes
        # its defaults of 1.0 and 1, which silently ships a version lower than
        # what is already live.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocationWhenInUseUsageDescription: "To detect which ballpark you're at and show the current matchup."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            statsapi.mlb.com:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nick.BallparkMatchups
        DEVELOPMENT_TEAM: "8VKMPP3AW2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
